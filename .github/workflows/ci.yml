name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test
      - run: node scripts/validate.ts
      - if: github.event_name == 'pull_request'
        run: node scripts/validate.ts --probe origin/${{ github.base_ref }}
